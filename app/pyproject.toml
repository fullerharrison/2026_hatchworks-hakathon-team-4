[project]
name = "uc4-mcp"
version = "0.1.0"
description = "Read-only MCP evidence layer over the UC4 v2 data files"
readme = "README.md"
authors = [
    { name = "Harrison Fuller", email = "harrison.fuller@syngenta.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2,<3",
    "pandas>=3.0.6",
]

[project.scripts]
uc4-mcp = "uc4_mcp.server:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# analysis/uc4_eda/ has test modules with the same basenames and no __init__.py.
addopts = "--import-mode=importlib"
# Lets test_checks reuse test_lifecycle's synthetic tables.
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
