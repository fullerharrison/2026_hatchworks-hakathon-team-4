[project]
name = "uc4-mcp"
version = "0.1.0"
description = "UC4 evidence layer (read-only MCP tools) and the question agent over it"
readme = "README.md"
authors = [
    { name = "Harrison Fuller", email = "harrison.fuller@syngenta.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.15,<5",
    "fastapi>=0.142,<1",
    "httpx2>=2.13,<3",
    "mcp[cli]>=2.2,<3",
    "openai>=3.22,<4",
    "pandas>=3.0.6",
    "python-dotenv>=1.2,<2",
    "uvicorn>=0.54,<1",
]

[project.scripts]
uc4-mcp = "uc4_mcp.server:main"
uc4-ask = "uc4_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# analysis/uc4_eda/ has test modules with the same basenames and no __init__.py.
# Live-model tests spend tokens; run them explicitly with -m live.
# Browser tests need Chrome and the browser group; run them with -m browser.
addopts = "--import-mode=importlib -m \"not live and not browser\""
# Lets test_checks reuse test_lifecycle's synthetic tables, and tests import fakes.py.
pythonpath = ["tests"]
markers = [
    "live: calls the real model through Portkey (needs PORTKEY_API_KEY)",
    "browser: drives the breeder screen in Chrome with real input (needs --group browser)",
]

[dependency-groups]
browser = [
    "playwright>=1.50,<2",
]
dev = [
    "pytest>=9.1.1",
]
